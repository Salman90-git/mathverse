<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formula Library · MathVerse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <style>
    .cat-btn {
      padding: 0.4rem 1.1rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(139, 92, 246, 0.3);
      color: #a78bfa;
      background: transparent;
      transition: all 0.18s;
      white-space: nowrap;
    }
    .cat-btn:hover {
      background: rgba(139, 92, 246, 0.15);
      border-color: rgba(139, 92, 246, 0.6);
    }
    .cat-btn.active {
      background: linear-gradient(135deg, #7c3aed, #0891b2);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 0 14px rgba(124, 58, 237, 0.4);
    }
    .formula-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 1rem;
      padding: 1.4rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      position: relative;
    }
    .formula-card:hover {
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow: 0 6px 30px rgba(124, 58, 237, 0.15);
      transform: translateY(-2px);
    }
    .formula-card.favorited {
      border-color: rgba(245, 158, 11, 0.4);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.1);
    }
    .star-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.35rem;
      line-height: 1;
      transition: transform 0.2s;
      padding: 0.1rem;
      color: #64748b;
    }
    .star-btn:hover { transform: scale(1.25); }
    .star-btn.starred { color: #f59e0b; }
    .katex-formula {
      font-size: 1.15rem;
      color: #e2e8f0;
      overflow-x: auto;
      padding: 0.25rem 0;
    }
    .cat-badge {
      display: inline-block;
      padding: 0.2rem 0.7rem;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-algebra       { background: rgba(167, 139, 250, 0.2); color: #a78bfa; }
    .badge-geometry      { background: rgba(34, 211, 238, 0.2);  color: #22d3ee; }
    .badge-trigonometry  { background: rgba(52, 211, 153, 0.2);  color: #34d399; }
    .badge-calculus      { background: rgba(248, 113, 113, 0.2); color: #f87171; }
    .badge-statistics    { background: rgba(251, 191, 36, 0.2);  color: #fbbf24; }

    .search-wrap {
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #64748b;
    }
    #search-input {
      padding-left: 2.75rem;
    }

    .spinner {
      width: 3rem;
      height: 3rem;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 4rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #formula-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 2rem;
      color: #64748b;
    }
    .empty-state svg {
      width: 3rem;
      height: 3rem;
      margin: 0 auto 1rem;
      opacity: 0.4;
    }
  </style>
</head>
<body class="page-wrapper">
  <main id="main-content" class="page-content">

    <!-- Hero -->
    <section class="text-center mb-10">
      <div class="badge mb-3">📐 Reference Library</div>
      <h1 class="text-4xl md:text-5xl font-bold mb-3">
        <span class="gradient-text">Formula Library</span>
      </h1>
      <p class="section-subtitle max-w-xl mx-auto">
        Browse, search, and star your favourite mathematical formulas across algebra, geometry, trigonometry, calculus, and statistics.
      </p>
      <!-- Stats bar -->
      <div class="flex justify-center gap-6 mt-5">
        <span class="text-sm text-slate-400">
          Total: <strong id="total-count" class="text-purple-300">0</strong>
        </span>
        <span class="text-slate-600">|</span>
        <span class="text-sm text-slate-400">
          Showing: <strong id="showing-count" class="text-cyan-300">0</strong>
        </span>
        <span class="text-slate-600">|</span>
        <span class="text-sm text-slate-400">
          ⭐ Favorites: <strong id="fav-count" class="text-amber-400">0</strong>
        </span>
      </div>
    </section>

    <!-- Controls -->
    <section class="mb-6 space-y-4 max-w-4xl mx-auto">
      <!-- Search -->
      <div class="search-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input
          id="search-input"
          type="search"
          class="input w-full"
          placeholder="Search formulas by name or description…"
          aria-label="Search formulas"
        />
      </div>
      <!-- Category filter -->
      <div class="flex flex-wrap gap-2" role="group" aria-label="Filter by category" id="cat-buttons">
        <!-- Injected by JS -->
      </div>
    </section>

    <!-- Grid -->
    <section class="max-w-6xl mx-auto">
      <div id="loading-state" class="text-center">
        <div class="spinner"></div>
        <p class="text-slate-400 text-sm">Loading formulas…</p>
      </div>
      <div id="error-state" class="hidden text-center py-16">
        <div class="text-5xl mb-4">⚠️</div>
        <h2 class="text-xl font-semibold text-red-400 mb-2">Failed to load formulas</h2>
        <p class="text-slate-400 text-sm" id="error-msg"></p>
        <button class="btn btn-primary mt-4" id="retry-btn">Retry</button>
      </div>
      <div id="formula-grid" class="hidden" role="list" aria-label="Formula cards">
        <!-- Injected by JS -->
      </div>
    </section>

  </main>

  <script type="module">
    import '../js/main.js';

    /* ─────────────────────────── STATE ─────────────────────────── */
    let allFormulas    = [];
    let favorites      = new Set(JSON.parse(localStorage.getItem('mv-favorites') || '[]'));
    let activeCategory = 'all';
    let searchQuery    = '';

    /* ─────────────────────────── ELEMENTS ─────────────────────────── */
    const loadingEl     = document.getElementById('loading-state');
    const errorEl       = document.getElementById('error-state');
    const errorMsg      = document.getElementById('error-msg');
    const retryBtn      = document.getElementById('retry-btn');
    const formulaGrid   = document.getElementById('formula-grid');
    const searchInput   = document.getElementById('search-input');
    const catButtons    = document.getElementById('cat-buttons');
    const totalCountEl  = document.getElementById('total-count');
    const showingCountEl= document.getElementById('showing-count');
    const favCountEl    = document.getElementById('fav-count');

    /* ─────────────────────────── CONSTANTS ─────────────────────────── */
    const CATEGORIES = ['all', 'algebra', 'geometry', 'trigonometry', 'calculus', 'statistics'];
    const CAT_LABELS = {
      all: 'All',
      algebra: 'Algebra',
      geometry: 'Geometry',
      trigonometry: 'Trigonometry',
      calculus: 'Calculus',
      statistics: 'Statistics'
    };

    /* ─────────────────────────── FETCH ─────────────────────────── */
    async function fetchFormulas() {
      loadingEl.classList.remove('hidden');
      errorEl.classList.add('hidden');
      formulaGrid.classList.add('hidden');

      try {
        const res = await fetch('../data/formulas.json');
        if (!res.ok) throw new Error(`HTTP ${res.status} – ${res.statusText}`);
        allFormulas = await res.json();
        totalCountEl.textContent = allFormulas.length;
        buildCategoryButtons();
        renderGrid();
        loadingEl.classList.add('hidden');
        formulaGrid.classList.remove('hidden');
      } catch (err) {
        loadingEl.classList.add('hidden');
        errorMsg.textContent = err.message;
        errorEl.classList.remove('hidden');
      }
    }

    /* ─────────────────────────── CATEGORY BUTTONS ─────────────────────────── */
    function buildCategoryButtons() {
      catButtons.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const count = cat === 'all'
          ? allFormulas.length
          : allFormulas.filter(f => f.category === cat).length;

        const btn = document.createElement('button');
        btn.className = 'cat-btn' + (cat === activeCategory ? ' active' : '');
        btn.textContent = `${CAT_LABELS[cat]} (${count})`;
        btn.dataset.cat = cat;
        btn.setAttribute('aria-pressed', cat === activeCategory ? 'true' : 'false');
        btn.addEventListener('click', () => {
          activeCategory = cat;
          buildCategoryButtons();
          renderGrid();
        });
        catButtons.appendChild(btn);
      });
    }

    /* ─────────────────────────── FILTER ─────────────────────────── */
    function getFiltered() {
      return allFormulas.filter(f => {
        const matchCat = activeCategory === 'all' || f.category === activeCategory;
        const q = searchQuery.toLowerCase();
        const matchSearch = !q
          || f.title.toLowerCase().includes(q)
          || f.description.toLowerCase().includes(q);
        return matchCat && matchSearch;
      });
    }

    /* ─────────────────────────── RENDER ─────────────────────────── */
    function renderGrid() {
      const filtered = getFiltered();
      showingCountEl.textContent = filtered.length;
      favCountEl.textContent = favorites.size;

      formulaGrid.innerHTML = '';

      if (filtered.length === 0) {
        formulaGrid.innerHTML = `
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.182 16.318A4.486 4.486 0 0 0 12.016 15a4.486 4.486 0 0 0-3.198 1.318M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0ZM9.75 9.75c0 .414-.168.75-.375.75S9 10.164 9 9.75 9.168 9 9.375 9s.375.336.375.75Zm-.375 0h.008v.015h-.008V9.75Zm5.625 0c0 .414-.168.75-.375.75s-.375-.336-.375-.75.168-.75.375-.75.375.336.375.75Zm-.375 0h.008v.015h-.008V9.75Z"/>
            </svg>
            <p class="text-lg font-semibold mb-1">No formulas found</p>
            <p class="text-sm">Try a different search term or category.</p>
          </div>`;

        // Still need to trigger KaTeX even with no results
        triggerKaTeX();
        return;
      }

      filtered.forEach(f => {
        const isFav = favorites.has(f.id);
        const card = document.createElement('article');
        card.className = 'formula-card' + (isFav ? ' favorited' : '');
        card.setAttribute('role', 'listitem');
        card.setAttribute('aria-label', f.title);
        card.innerHTML = `
          <button
            class="star-btn${isFav ? ' starred' : ''}"
            aria-label="${isFav ? 'Remove from favorites' : 'Add to favorites'}: ${f.title}"
            data-id="${f.id}"
            title="${isFav ? 'Remove from favorites' : 'Add to favorites'}"
          >${isFav ? '★' : '☆'}</button>

          <div>
            <span class="cat-badge badge-${f.category}">${CAT_LABELS[f.category] || f.category}</span>
          </div>

          <h2 class="text-base font-bold text-slate-100 pr-8">${escapeHtml(f.title)}</h2>

          <div class="katex-formula" aria-label="Formula: ${escapeHtml(f.title)}">
            \\(${f.latex}\\)
          </div>

          <p class="text-sm text-slate-400 leading-relaxed">${escapeHtml(f.description)}</p>
        `;

        // Star button handler
        card.querySelector('.star-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          toggleFavorite(f.id);
        });

        formulaGrid.appendChild(card);
      });

      triggerKaTeX();
    }

    /* ─────────────────────────── KATEX ─────────────────────────── */
    function triggerKaTeX() {
      // renderMathInElement is loaded deferred; safe after 'load' event
      if (typeof renderMathInElement === 'function') {
        renderMathInElement(formulaGrid, {
          delimiters: [
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true }
          ],
          throwOnError: false
        });
      }
    }

    /* ─────────────────────────── FAVORITES ─────────────────────────── */
    function toggleFavorite(id) {
      if (favorites.has(id)) {
        favorites.delete(id);
      } else {
        favorites.add(id);
      }
      localStorage.setItem('mv-favorites', JSON.stringify([...favorites]));
      renderGrid();
    }

    /* ─────────────────────────── UTILS ─────────────────────────── */
    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* ─────────────────────────── EVENTS ─────────────────────────── */
    searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value.trim();
      renderGrid();
    });

    retryBtn.addEventListener('click', fetchFormulas);

    /* ─────────────────────────── INIT ─────────────────────────── */
    // KaTeX scripts are deferred; wait for window load to ensure they are available
    window.addEventListener('load', () => {
      fetchFormulas();
    });
  </script>
</body>
</html>
